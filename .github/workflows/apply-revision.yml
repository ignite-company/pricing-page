name: Apply calculator revision

on:
  push:
    paths:
      - .github/workflows/apply-revision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply revision
        run: python .patch/apply.py

      - name: Verify calculator revision
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          calc = s[s.index('<!-- ROI CALCULATOR -->'):s.index('<!-- PAYMENT OPTIONS -->')]
          assert 'Foundation recovery calculator' in calc
          assert 'What happens as the system keeps working' not in calc
          assert '$3,500 Scale investment' not in calc
          assert '$3,500 Ignite investment' not in calc
          assert '$1,500 Foundation Build' not in calc
          assert 'to recover $1,500' not in calc
          assert 'Longer-term system economics' in calc
          print('calculator revision verified')
          PY

      - name: Commit pricing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Revise calculator presentation" || exit 0
          git push origin main
