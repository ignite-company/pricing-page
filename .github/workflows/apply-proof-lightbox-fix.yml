name: Apply proof lightbox fix

on:
  push:
    paths:
      - '.github/workflows/apply-proof-lightbox-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply proof lightbox and loading fix
        run: python .patch/proof-lightbox-fix.py
      - name: Verify proof experience
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert 'IGNITE PROOF LIGHTBOX V1' in s
          assert 'id="ignite-proof-lightbox"' in s
          assert 'loading="eager" decoding="async"' in s
          assert '#ignite-offers-v7 .calc-proof-window:hover .calc-proof-track' in s
          assert 'animation-play-state:running' in s
          assert "track.style.animationPlayState = 'paused'" in s
          assert "track.style.animationPlayState = 'running'" in s
          print('verified proof preload, continuous scroll, pause-on-expand, and resume-on-close')
          PY
      - name: Commit proof experience fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve proof carousel loading and add image lightbox" || exit 0
          git push
