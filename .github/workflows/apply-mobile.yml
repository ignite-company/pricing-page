name: Apply mobile optimization

on:
  push:
    paths:
      - .github/workflows/apply-mobile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply mobile-only optimization
        run: python .patch/mobile_apply.py

      - name: Verify mobile optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert 'name="viewport"' in s
          assert 'MOBILE OPTIMIZATION V1' in s
          assert '@media (max-width:760px)' in s
          assert '#ignite-offers-v7 .calc-hero-results' in s
          assert '#ignite-offers-v7 .primary-grid' in s
          print('mobile optimization verified')
          PY

      - name: Commit mobile optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize pricing page for mobile" || exit 0
          git push origin main
